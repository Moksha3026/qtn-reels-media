name: Post Reel to Instagram

on:
  schedule:
    # Runs every hour, every day. GitHub's `schedule` trigger is best-effort
    # and can fire late or occasionally get skipped entirely under load --
    # confirmed in practice (posts landing hours late, one day fully missed).
    # Running hourly means post_reel.py itself decides whether "now" is a
    # valid posting moment (see WEEKDAY/WEEKEND_TARGET_UTC and
    # MIN_HOURS_BETWEEN_POSTS in that script) -- so even if a specific
    # hour's trigger is late or skipped, the next one catches it within
    # about an hour instead of many hours or a full missed day.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Check incoming/ and post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_reel.py

      - name: Commit archive move
        run: |
          git config user.name "reel-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Archive posted media"
          git push
