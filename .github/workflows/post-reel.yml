name: Post Reel to Instagram

on:
  schedule:
    # Weekday evenings, IST (19:00 IST = 13:30 UTC)
    - cron: "30 13 * * 1-5"
    # Weekend late mornings, IST (11:00 IST = 05:30 UTC)
    - cron: "30 5 * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Check incoming/ and post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_reel.py

      - name: Commit archive move
        run: |
          git config user.name "reel-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Archive posted media"
          git push
